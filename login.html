<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inkwell | Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login">
  <header id="site-header"></header>

  <main class="container auth-wrap">
    <form id="loginForm" class="card form" novalidate>
      <h1>Welcome back</h1>
      <p class="muted">Log in to manage your posts.</p>

      <div id="formMsg" class="msg" role="alert" hidden></div>

      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" required />

      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required />

      <button type="submit" class="btn btn-block">Login</button>
      <p class="muted center">No account? <a href="register.html">Register</a></p>
    </form>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
