<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inkwell | Profile</title>
  <script>try{var d=document.documentElement,t=localStorage.getItem("inkwell_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");d.dataset.theme=t;if(localStorage.getItem("blog_session"))d.classList.add("authed")}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&family=Lora:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="profile">
  <header id="site-header"></header>

  <main>
    <div class="container page">
      <div class="dash-head">
        <div>
          <p class="eyebrow">Your account</p>
          <h1>Profile</h1>
          <p class="muted">Manage how you appear on Inkwell and keep your account secure.</p>
        </div>
        <a href="dashboard.html" class="btn btn-ghost">
          <span data-icon="dashboard" data-size="18"></span> Dashboard
        </a>
      </div>

      <section id="profilePanel" class="profile" aria-live="polite"></section>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
