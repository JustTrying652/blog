<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inkwell | Log in</title>
  <script>try{var d=document.documentElement,t=localStorage.getItem("inkwell_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");d.dataset.theme=t}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&family=Lora:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login">
  <header id="site-header"></header>

  <main class="auth">
    <aside class="auth-aside">
      <a class="brand" href="index.html">
        <span class="brand-mark" data-icon="logo" data-size="28"></span>
        <span class="brand-name">Inkwell</span>
      </a>
      <div class="auth-quote">
        <p class="auth-tagline">Every thought has a place.</p>
        <p class="auth-sub">Read ideas worth your time. Write the ones worth sharing.</p>
      </div>
    </aside>

    <section class="auth-main">
      <form id="loginForm" class="auth-form" novalidate>
        <h1>Welcome back</h1>
        <p class="muted">Log in to pick up where you left off.</p>

        <div id="formMsg" class="msg" role="alert" hidden></div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" autocomplete="current-password" required />
            <button type="button" class="pw-toggle" aria-label="Show password" aria-pressed="false" data-icon="eye" data-size="20"></button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Log in</button>
        <p class="muted center auth-switch">New to Inkwell? <a href="register.html">Create an account</a></p>
      </form>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
