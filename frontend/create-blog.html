<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inkwell | Create Blog</title>
  <script>try{var d=document.documentElement,t=localStorage.getItem("inkwell_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");d.dataset.theme=t;if(localStorage.getItem("blog_session"))d.classList.add("authed")}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&family=Lora:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="create">
  <header id="site-header"></header>

  <main>
    <div class="studio">
      <div class="studio-top">
        <a class="back-link" href="dashboard.html"><span data-icon="arrowLeft" data-size="18"></span> Dashboard</a>
        <p class="eyebrow">New article</p>
      </div>

      <form id="blogForm" novalidate>
        <div id="editorPane">
          <label class="sr-only" for="title">Title</label>
          <input type="text" id="title" class="title-input" placeholder="Title" maxlength="100" autocomplete="off" required />

          <div class="studio-meta">
            <div class="select-wrap">
              <label class="sr-only" for="category">Category</label>
              <select id="category" required>
                <option value="">Choose a category</option>
                <option>Technology</option>
                <option>Security</option>
                <option>Tutorial</option>
                <option>Life</option>
              </select>
            </div>
            <div class="counters">
              <span id="wordCount">0 words</span>
              <span id="charCount">0 / 5000</span>
            </div>
          </div>

          <label class="sr-only" for="content">Article body</label>
          <textarea id="content" class="body-input" placeholder="Tell your story…" maxlength="5000" required></textarea>
        </div>

        <article id="previewPane" class="article article-preview" hidden></article>

        <div id="formMsg" class="msg" role="alert" hidden></div>

        <div class="studio-bar">
          <button type="button" class="btn btn-ghost" id="previewBtn">Preview</button>
          <button type="submit" class="btn btn-primary">Publish</button>
        </div>
      </form>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
