<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inkwell | Create your account</title>
  <script>try{var d=document.documentElement,t=localStorage.getItem("inkwell_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");d.dataset.theme=t}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&family=Lora:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="register">
  <header id="site-header"></header>

  <main class="auth">
    <aside class="auth-aside">
      <a class="brand" href="index.html">
        <span class="brand-mark" data-icon="logo" data-size="28"></span>
        <span class="brand-name">Inkwell</span>
      </a>
      <div class="auth-quote">
        <p class="auth-tagline">Start with one good sentence.</p>
        <p class="auth-sub">Create an account to publish your articles and keep them all in one place.</p>
      </div>
    </aside>

    <section class="auth-main">
      <form id="registerForm" class="auth-form" novalidate>
        <h1>Create your account</h1>
        <p class="muted">It takes less than a minute.</p>

        <div id="formMsg" class="msg" role="alert" hidden></div>

        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" autocomplete="name" maxlength="60" required />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" autocomplete="new-password" required />
            <button type="button" class="pw-toggle" aria-label="Show password" aria-pressed="false" data-icon="eye" data-size="20"></button>
          </div>
          <p class="field-hint">At least 8 characters.</p>
        </div>

        <div class="field">
          <label for="confirm">Confirm password</label>
          <div class="input-wrap">
            <input type="password" id="confirm" autocomplete="new-password" required />
            <button type="button" class="pw-toggle" aria-label="Show password" aria-pressed="false" data-icon="eye" data-size="20"></button>
          </div>
          <p class="field-hint" id="confirmHint" aria-live="polite"></p>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Create account</button>
        <p class="muted center auth-switch">Already registered? <a href="login.html">Log in</a></p>
      </form>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
