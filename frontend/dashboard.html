<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inkwell | Dashboard</title>
  <script>try{var d=document.documentElement,t=localStorage.getItem("inkwell_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");d.dataset.theme=t;if(localStorage.getItem("blog_session"))d.classList.add("authed")}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&family=Lora:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="dashboard">
  <header id="site-header"></header>

  <main>
    <div class="container page">
      <div class="dash-head">
        <div>
          <p class="eyebrow">Your workspace</p>
          <h1 id="welcome">Welcome back.</h1>
          <p class="muted">Pick up where you left off, or start something new.</p>
        </div>
        <a href="create-blog.html" class="btn btn-primary">
          <span data-icon="pen" data-size="18"></span> Create Blog
        </a>
      </div>

      <div class="stats">
        <div class="stat"><span class="num" id="statPosts">0</span><small>Your articles</small></div>
        <div class="stat"><span class="num" id="statThoughts">0</span><small>Your thoughts</small></div>
        <div class="stat"><span class="num" id="statWords">0</span><small>Words written</small></div>
        <div class="stat"><span class="num" id="statAll">0</span><small>Posts on Inkwell</small></div>
      </div>

      <div class="tabs" role="group" aria-label="Show">
        <button type="button" class="tab is-active" data-tab="article" aria-pressed="true">Articles <span class="count" id="tabArticlesCount">0</span></button>
        <button type="button" class="tab" data-tab="thought" aria-pressed="false">Thoughts <span class="count" id="tabThoughtsCount">0</span></button>
      </div>

      <div id="myPosts" class="list" aria-live="polite"></div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
