<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inkwell | Post</title>
  <script>try{var d=document.documentElement,t=localStorage.getItem("inkwell_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");d.dataset.theme=t;if(localStorage.getItem("blog_session"))d.classList.add("authed")}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&family=Lora:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="post">
  <header id="site-header"></header>

  <main>
    <div class="article-wrap">
      <a href="index.html" class="back-link"><span data-icon="arrowLeft" data-size="18"></span> Back to home</a>
      <article id="postView" class="article" aria-live="polite"></article>
    </div>

    <section id="related" class="related" hidden>
      <div class="container">
        <div class="section-head"><h2 id="relatedTitle">Keep reading</h2></div>
        <div id="relatedList" class="featured-more"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="footer"></footer>

  <script src="js/app.js"></script>
</body>
</html>
