<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inkwell | Create Blog</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="create">
  <header id="site-header"></header>

  <main class="container auth-wrap">
    <form id="blogForm" class="card form form-wide" novalidate>
      <h1>Create a new post</h1>

      <div id="formMsg" class="msg" role="alert" hidden></div>

      <label for="title">Title</label>
      <input type="text" id="title" maxlength="100" required />

      <label for="category">Category</label>
      <select id="category" required>
        <option value="">Select a category</option>
        <option>Technology</option>
        <option>Security</option>
        <option>Tutorial</option>
        <option>Life</option>
      </select>

      <label for="content">Content</label>
      <textarea id="content" rows="10" required></textarea>

      <button type="submit" class="btn btn-block">Publish</button>
    </form>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
