<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inkwell | Register</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="register">
  <header id="site-header"></header>

  <main class="container auth-wrap">
    <form id="registerForm" class="card form" novalidate>
      <h1>Create your account</h1>
      <p class="muted">It takes less than a minute.</p>

      <div id="formMsg" class="msg" role="alert" hidden></div>

      <label for="name">Full name</label>
      <input type="text" id="name" autocomplete="name" required />

      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" required />

      <label for="password">Password (min 8 characters)</label>
      <input type="password" id="password" autocomplete="new-password" required />

      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" autocomplete="new-password" required />

      <button type="submit" class="btn btn-block">Register</button>
      <p class="muted center">Already registered? <a href="login.html">Login</a></p>
    </form>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
